    <meta charset="UTF-8">
    <title>Video Player</title>
    <style>
        body {
            margin: 0;
            background: #000;
        }
        video {
            width: 100%;
            height: 100vh;
            object-fit: contain;
            background: #000;
        }
    </style>
</head>
<body>
<style>
#ageGate{
position:fixed;
inset:0;
background:rgba(0,0,0,.92);
backdrop-filter:blur(10px);
display:flex;
justify-content:center;
align-items:center;
z-index:999999;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

.age-box{
width:90%;
max-width:420px;
background:#181818;
border:1px solid rgba(255,255,255,.08);
border-radius:20px;
padding:35px;
text-align:center;
box-shadow:0 25px 60px rgba(0,0,0,.5);
color:#fff;
animation:fade .4s ease;
}

.icon{
font-size:56px;
margin-bottom:12px;
}

.age-box h1{
margin:0;
font-size:28px;
}

.age-box p{
color:#cfcfcf;
margin:18px 0 30px;
line-height:1.6;
}

.btn{
width:100%;
padding:15px;
font-size:17px;
border:none;
border-radius:12px;
cursor:pointer;
margin-top:12px;
transition:.25s;
}

.btn-yes{
background:#ff1744;
color:#fff;
}

.btn-yes:hover{
transform:translateY(-2px);
}

.btn-no{
background:#2b2b2b;
color:#fff;
}

.btn-no:hover{
background:#3a3a3a;
}

@keyframes fade{
from{
opacity:0;
transform:scale(.9);
}
to{
opacity:1;
transform:scale(1);
}
}
</style>

<script>
if(localStorage.getItem("adult18")){
 document.getElementById("ageGate").style.display="none";
}

function allowAge(){
 localStorage.setItem("adult18","1");
 document.getElementById("ageGate").style.display="none";
}
</script>
<video id="player" controls autoplay muted playsinline></video>

<script>
    const params = new URLSearchParams(window.location.search);
    const videoUrl = params.get("video");
    const player = document.getElementById("player");

    if (videoUrl) {
        player.src = videoUrl;
        player.play().catch(error => {
            console.log("Autoplay prevented:", error);
        });
    } else {
        document.body.innerHTML = "<h2 style='color:white;text-align:center;margin-top:40px;'>No Video Found</h2>";
    }

    // SmartLink នឹងលោតឡើងនៅពេលដែលអ្នកប្រើប្រាស់ចុចលើវីដេអូក្នុង App X
    let smartLinkOpened = false;
    player.addEventListener('click', function() {
        if (!smartLinkOpened) {
            smartLinkOpened = true;
            // ជំនួស 'https://s.pemsrv.com/v1/link.php?cat=&idzone=5986808&type=8' ជាមួយ Link SmartLink របស់អ្នក
            window.open('https://s.pemsrv.com/v1/link.php?cat=&idzone=5986808&type=8', '_blank');
        }
    });
</script>

</body>
</html>
