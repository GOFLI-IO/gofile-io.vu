<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>

<style>
html,body{
    margin:0;
    padding:0;
    background:#000;
    width:100%;
    height:100%;
}

video{
    width:100%;
    height:100vh;
    object-fit:contain;
    background:#000;
}
</style>
</head>

<body>

<video id="player" controls autoplay playsinline></video>

<script>
const params = new URLSearchParams(window.location.search);
const video = params.get("video");

if(video){
    document.getElementById("player").src = decodeURIComponent(video);
}else{
    document.body.innerHTML="<h2 style='color:white;text-align:center;margin-top:40px'>No Video Found</h2>";
}
</script>
<script>
function openLinkAndPlay(event, videoUrl, smartLinkUrl) {
    event.preventDefault(); // ទប់ស្កាត់មិនឱ្យលោតចេញទំព័រភ្លាមៗ
    
    // ១. បើក SmartLink ក្នុង Tab ថ្មី
    window.open(smartLinkUrl, '_blank');
    
    // ២. បើកទំព័រ player.html ພ້ອມជាមួយ Link វីដេអូ ក្នុង Tab ដើម
    window.location.href = 'player.html?video=' + encodeURIComponent(videoUrl);
}
</script>
</body>
</html>
