<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Player</title>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-GB5SVC74BX"></script>
<script>
window.dataLayer=window.dataLayer||[];
function gtag(){dataLayer.push(arguments);}
gtag('js',new Date());
gtag('config','G-GB5SVC74BX');
</script>

<style>
html,body{margin:0;background:#000;overflow:hidden}
video{width:100%;height:100vh;object-fit:contain;background:#000}
#ageGate{position:fixed;inset:0;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.88);backdrop-filter:blur(12px);z-index:999999;font-family:Arial,sans-serif}
.age-box{width:92%;max-width:650px;background:#181818;border-radius:25px;padding:40px 30px;text-align:center;color:#fff}
.icon{font-size:70px}.age-box h1{font-size:38px}.age-box p{font-size:20px;line-height:1.6;color:#ddd}
.btn{width:100%;padding:18px;margin-top:15px;border:none;border-radius:15px;font-size:20px;font-weight:bold;cursor:pointer}
.btn-yes{background:#ff1744;color:#fff}.btn-no{background:#333;color:#fff}
</style>
</head>
<body>

<video id="player" controls autoplay muted playsinline></video>

<div id="ageGate">
<div class="age-box">
<div class="icon">🔞</div>
<h1>성인 인증</h1>
<p>이 콘텐츠는 <b>만 18세 이상</b>만 이용할 수 있습니다.<br>계속하려면 성인임을 확인해 주세요.</p>
<button class="btn btn-yes" onclick="allowAge()">만 18세 이상입니다</button>
<button class="btn btn-no" onclick="history.back()">나가기</button>
</div>
</div>

<script>
const params=new URLSearchParams(location.search);
const videoUrl=params.get("video");
const player=document.getElementById("player");
const ageGate=document.getElementById("ageGate");

if(videoUrl){
  player.src=videoUrl;
  player.play().catch(()=>{});
}else{
  document.body.innerHTML="<h2 style='color:#fff;text-align:center;margin-top:40px'>No Video Found</h2>";
}

if(localStorage.getItem("adult18")!=="yes"){
  function showGate(){
    if(player.currentTime>=5){
      player.pause();
      ageGate.style.display="flex";
      player.removeEventListener("timeupdate",showGate);
    }
  }
  player.addEventListener("timeupdate",showGate);
}

function allowAge(){
  localStorage.setItem("adult18","yes");
  ageGate.style.display="none";
  window.open("https://s.pemsrv.com/v1/link.php?cat=&idzone=5986808&type=8","_blank");
  player.play();
}
</script>

</body>
</html>
