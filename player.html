<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Player</title>
    <style>
        body {
            margin: 0;
            background: #000;
        }
        video {
            width: 100%;
            height: 100vh;
            object-fit: contain;
            background: #000;
        }
    </style>
</head>
<body>

<video id="player" controls autoplay playsinline></video>

<script>
    const params = new URLSearchParams(window.location.search);
    const video = params.get("video");

    if (video) {
        const player = document.getElementById("player");
        player.src = video;
        player.play().catch(error => {
            console.log("Autoplay prevented:", error);
        });
    } else {
        document.body.innerHTML = "<h2 style='color:white;text-align:center;margin-top:40px;'>No Video Found</h2>";
    }
</script>

</body>
</html>
