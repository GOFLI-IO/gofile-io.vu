    <meta charset="UTF-8">
    <title>Video Player</title>
    <style>
        body {
            margin: 0;
            background: #000;
        }
        video {
            width: 100%;
            height: 100vh;
            object-fit: contain;
            background: #000;
        }
    </style>

<body>
<video id="player" controls autoplay muted playsinline></video>

<script>
    const params = new URLSearchParams(window.location.search);
    const videoUrl = params.get("video");
    const player = document.getElementById("player");

    if (videoUrl) {
        player.src = videoUrl;
        player.play().catch(error => {
            console.log("Autoplay prevented:", error);
        });
    } else {
        document.body.innerHTML = "<h2 style='color:white;text-align:center;margin-top:40px;'>No Video Found</h2>";
    }

    // SmartLink នឹងលោតឡើងនៅពេលដែលអ្នកប្រើប្រាស់ចុចលើវីដេអូក្នុង App X
    let smartLinkOpened = false;
    player.addEventListener('click', function() {
        if (!smartLinkOpened) {
            smartLinkOpened = true;
            // ជំនួស 'https://s.pemsrv.com/v1/link.php?cat=&idzone=5986808&type=8' ជាមួយ Link SmartLink របស់អ្នក
            window.open('https://s.pemsrv.com/v1/link.php?cat=&idzone=5986808&type=8', '_blank');
        }
    });
</script>
<!-- 18+ Age Verification -->
<div id="ageGate">
  <div class="age-box">

    <div class="icon">🔞</div>

    <h1>성인 인증</h1>

    <p>
      이 콘텐츠는 <strong>만 18세 이상</strong>만 이용할 수 있습니다.<br>
      계속하려면 성인임을 확인해 주세요.

    <button class="btn btn-yes" onclick="allowAge()">
      만 18세 이상입니다

    <button class="btn btn-no" onclick="history.back()">
      나가기
    </button>
<script>
function allowAge() {

    localStorage.setItem("adult18", "yes");

    location.href = "https://s.pemsrv.com/v1/link.php?cat=&idzone=5986808&type=8";

}
</script>
  </div>
</div>

<style>
#ageGate{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.88);
    backdrop-filter:blur(12px);
    z-index:999999;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

.age-box{
    width:94%;
    max-width:650px;
    background:#181818;
    border-radius:30px;
    padding:50px 35px;
    text-align:center;
    color:#fff;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 30px 80px rgba(0,0,0,.6);
    animation:popup .35s ease;
}

.icon{
    font-size:90px;
    margin-bottom:20px;
}

.age-box h1{
    margin:0;
    font-size:42px;
    font-weight:700;
}

.age-box p{
    margin:25px 0 40px;
    font-size:22px;
    line-height:1.7;
    color:#ddd;
}

.btn{
    width:100%;
    padding:20px;
    font-size:22px;
    font-weight:700;
    border:none;
    border-radius:16px;
    cursor:pointer;
    transition:.25s;
    margin-top:15px;
}

.btn-yes{
    background:#ff1744;
    color:#fff;
}

.btn-yes:hover{
    transform:scale(1.02);
}

.btn-no{
    background:#2f2f2f;
    color:#fff;
}

.btn-no:hover{
    background:#444;
}

@keyframes popup{
    from{
        opacity:0;
        transform:scale(.9);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

/* Mobile */
@media(max-width:600px){

.age-box{
    padding:40px 25px;
    border-radius:24px;
}

.icon{
    font-size:72px;
}

.age-box h1{
    font-size:34px;
}

.age-box p{
    font-size:19px;
}

.btn{
    font-size:20px;
    padding:18px;
}

}
</style>

<script>
if(localStorage.getItem("adult18") === "yes"){
    document.getElementById("ageGate").style.display="none";
}

function allowAge(){
    localStorage.setItem("adult18","yes");
    document.getElementById("ageGate").style.display="none";
}
</script>
</body>
